on: [push, pull_request]
name: Test

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - run: nix flake check --accept-flake-config

      - name: test
        run: nix develop --accept-flake-config -c zig build test

      - run: nix build --accept-flake-config

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        target:
          - x86-linux-gnu
          - x86_64-linux-gnu
          - aarch64-macos
          - x86_64-windows-gnu
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - run: nix flake check --accept-flake-config

      - name: build
        run: nix develop --accept-flake-config -c zig build -Dtarget=${{ matrix.target }}
