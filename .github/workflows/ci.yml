name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86-linux-gnu
          - x86_64-linux-gnu
          - aarch64-macos
          - x86_64-windows-gnu
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ZIG_VERSION: 0.17.0
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        env:
          ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        run: |
          archive="zig-x86_64-linux-${ZIG_VERSION}"
          curl --fail --location --retry 3 "https://ziglang.org/download/${ZIG_VERSION}/${archive}.tar.xz" --output "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src
      - name: Build
        run: zig build -Dtarget=${{ matrix.target }}
      - name: Test
        run: zig build test
