on: [push, pull_request]
name: CI

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/nix-devshell

      - run: nix flake check --accept-flake-config

      - name: fmt
        run: nix develop --accept-flake-config -c zig fmt --check build.zig build.zig.zon src

      - name: test
        run: nix develop --accept-flake-config -c zig build test

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        target:
          - x86-linux-gnu
          - x86_64-linux-gnu
          - aarch64-macos
          - x86_64-windows-gnu
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/nix-devshell

      - name: build
        run: nix develop --accept-flake-config -c zig build -Dtarget=${{ matrix.target }}
