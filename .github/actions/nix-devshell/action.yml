name: Nix dev shell setup
description: Install Nix, print sandbox setting, cache Zig dependency fetches

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Nix sandbox setting
      shell: bash
      run: nix config show sandbox

    - name: Cache Zig global fetch cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/zig
        key: zig-cache-${{ hashFiles('build.zig.zon') }}
        restore-keys: |
          zig-cache-
